name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor go.mod declares. Keep these in step: a matrix naming a
        # version BELOW the directive does not test it. With GOTOOLCHAIN
        # unset, go satisfies a directive it is too old for by DOWNLOADING
        # a newer toolchain, so the leg goes on printing the version it
        # asked for while running another one. Measured here before this
        # change, in the job named "test (macos-latest / go1.22)":
        #
        #   Setup go version spec 1.22
        #   go version go1.27.1 darwin/arm64
        #
        # Six legs claimed 1.22 and 1.23; all six ran 1.27.1.
        go: ["1.27.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Without this the matrix cannot be wrong, because go quietly fetches
      # whatever go.mod asks for. With it, a leg naming a version below the
      # directive fails outright -- "go.mod requires go >= X (running go Y;
      # GOTOOLCHAIN=local)" -- which is the whole point of naming one.
      - name: Refuse a toolchain other than the one this leg asked for
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Show Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          go test -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tee cover.txt
          # The CLI in cmd/ is a thin wrapper around internal/rdiff and has no
          # unit tests; we gate coverage on the library only, where the
          # format/algorithm-correctness logic lives. The threshold is 100%
          # (org-wide hard rule): every branch must be reachable from tests, or
          # the dead code is removed — the bar is never lowered.
          pkg_cov=$(go test -coverprofile=cover-pkg.out ./internal/rdiff >/dev/null 2>&1 && \
                    go tool cover -func=cover-pkg.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "internal/rdiff coverage: ${pkg_cov}%"
          awk -v t="$pkg_cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::internal/rdiff coverage ${pkg_cov}% < 100%"; exit 1; }

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.os }}-go${{ matrix.go }}
          path: cover.out
          if-no-files-found: warn
