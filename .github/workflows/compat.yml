name: compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compat:
    name: cross-impl compat (linux / upstream librsync rdiff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          check-latest: true

      - name: Install upstream rdiff (librsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y rdiff
          rdiff --version || true

      - name: Compat tests
        run: go test -v -tags=compat ./internal/rdiff/...
