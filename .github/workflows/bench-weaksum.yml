name: bench-weaksum
on:
  push:
    branches: [experiment/asm-weaksum]
jobs:
  bench:
    runs-on: ubuntu-latest # native amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Confirm arch
        run: go env GOARCH
      - name: Benchmark weak checksum (Go vs asm)
        run: go test -run '^$' -bench WeakSum -benchmem -count=6 ./internal/rdiff/
